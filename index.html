<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary Practice</title>
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--ink:#3b3226;--mute:#8a7c68;--acc:#b8793a;--line:#e5d9c3;--ok:#4e8a52;--bad:#b4533f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1814;--card:#262019;--ink:#efe6d6;--mute:#a09480;--acc:#e0a45c;--line:#3a3227;--ok:#7bbf80;--bad:#e08a76}}
:root[data-theme="dark"]{--bg:#1c1814;--card:#262019;--ink:#efe6d6;--mute:#a09480;--acc:#e0a45c;--line:#3a3227;--ok:#7bbf80;--bad:#e08a76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;padding:70px 16px 90px;transition:background .3s,color .3s}
.wrap{width:100%}
#theme,#lang{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
#theme:active,#lang:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.win{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px rgba(80,55,20,.12);overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);font:600 12px system-ui,sans-serif;color:var(--mute)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.bar .st{margin-left:auto;display:flex;gap:12px}
.bar .g{color:var(--ok)}.bar .r{color:var(--bad)}
.body{padding:28px 24px;text-align:center}
.lvl{display:inline-block;font:600 11px system-ui,sans-serif;letter-spacing:.1em;color:var(--acc);border:1px solid var(--acc);border-radius:20px;padding:2px 10px}
.word{font-size:clamp(32px,8vw,46px);margin:14px 0 20px;font-weight:700;word-break:break-word}
input[type=text]{width:100%;padding:13px 16px;font:18px Georgia,serif;text-align:center;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;outline:none}
input[type=text]:focus{border-color:var(--acc)}
input.ok{border-color:var(--ok)}input.bad{border-color:var(--bad)}
.msg{min-height:24px;margin:10px 0;font:500 14px system-ui,sans-serif}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
button.b{font:600 14px system-ui,sans-serif;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.b:disabled{opacity:.4;cursor:default}
.hint{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:14px;position:relative;min-height:70px;display:flex;align-items:center;justify-content:center}
.hint .c{transition:filter .35s,opacity .35s;filter:blur(14px);opacity:.5;user-select:none;max-width:100%}
.hint.show .c{filter:none;opacity:1;user-select:auto}
.hint .lab{position:absolute;top:-9px;left:12px;background:var(--card);padding:0 6px;font:600 11px system-ui,sans-serif;color:var(--mute)}
.emo{font-size:56px;line-height:1}
.emo img{max-width:100%;max-height:170px;border-radius:8px;display:block}
.sen{font-size:17px;font-style:italic;line-height:1.5}
.sen mark{background:none;color:var(--acc);font-weight:700}
.tools{margin-top:14px;text-align:center;font:12px system-ui,sans-serif;color:var(--mute)}
.tools .b{font-size:12px;padding:7px 12px}
table{width:100%;border-collapse:collapse;font:14px system-ui,sans-serif;margin:14px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.sum td:last-child{text-align:right;font-weight:700;font-size:18px}
.det{max-height:260px;overflow:auto}
.det td:first-child{color:var(--mute)}
#lang{right:66px;font:700 13px system-ui,sans-serif;color:var(--ink)}

.stage{width:100%;display:grid;justify-items:center}
.panel{grid-area:1/1;width:100%;transform-origin:0 100%;transition:transform .38s cubic-bezier(.5,0,.2,1),opacity .3s}
#pv{max-width:560px}#pc{max-width:960px}
.panel.min{transform:translate(var(--tx,-42vw),var(--ty,62vh)) scale(.08);opacity:0;pointer-events:none}
.bar .fsb,.bar .mn{width:26px;height:26px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;color:var(--mute);display:grid;place-items:center;padding:0}
.bar .fsb:hover,.bar .mn:hover{color:var(--acc);border-color:var(--acc)}
.ttl{font:700 12px system-ui,sans-serif;letter-spacing:.06em;color:var(--mute)}
.dock{position:fixed;left:16px;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;gap:8px;z-index:5}
.dock button{font:800 12px system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:14px 18px 12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;cursor:pointer;box-shadow:0 -4px 14px rgba(80,55,20,.12);transition:transform .15s}
.dock button:hover{transform:translateY(-4px)}
.cb{text-align:left}
.cb .s{margin:0 0 14px;color:var(--mute);font:14px/1.5 system-ui,sans-serif}
#cdrop{border:2px dashed var(--line);background:var(--bg);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;font:15px/1.6 system-ui,sans-serif;color:var(--mute);transition:.2s}
#cdrop.on{border-color:var(--acc);color:var(--ink)}
.ct{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;align-items:center}
#cmsg{font:13px system-ui,sans-serif;color:var(--mute)}
.cb .tw{overflow:auto;max-height:min(46vh,400px);border:1px solid var(--line);border-radius:12px}
.cw table{margin:0;min-width:720px}
.cw th{color:var(--mute);font-weight:600}
.cw td img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block}
.cw td input[type=text]{min-width:110px;padding:7px 9px;font:13px system-ui,sans-serif;text-align:left;border-width:1px}
.b.sm{padding:6px 10px;font-size:12px}
.cn{color:var(--mute);white-space:nowrap}
.ib{position:relative;width:64px;height:64px;border:2px dashed var(--line);border-radius:10px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--mute);font:10px/1.25 system-ui,sans-serif;text-align:center;white-space:pre-line;transition:border-color .15s,color .15s}
.ib:hover,.ib:focus-within,.ib.on{border-color:var(--acc);color:var(--acc)}
.ib.has{border-style:solid}.ib.has .ph{display:none}
.ib .ph{pointer-events:none}
.cw td .ib img{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.cw td .ib input[type=text]{position:absolute;inset:0;width:100%;height:100%;min-width:0;padding:0;border:0;border-radius:0;opacity:0;cursor:pointer;font-size:16px}
.empty{padding:24px;text-align:center;color:var(--mute);font:14px system-ui,sans-serif}
#ph{max-width:min(900px,calc((100vh - 220px)*1.3333 + 48px))}
.gw{display:flex;flex-direction:column}.gw .bar{flex-wrap:wrap}
.tvb{background:#000}
.gscr{position:relative;aspect-ratio:4/3;background:#000;overflow:hidden;border-radius:6px;container-type:size;margin:0 auto;width:100%}
.gscr canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hans{position:absolute;left:50%;bottom:1.6%;transform:translateX(-50%);width:44%;height:6.2%;z-index:2;font:700 3.4cqw/1 'Courier New',monospace;text-align:center;background:#06140a;color:#6cff8a;border:2px solid #2f8f4a;border-radius:4px;padding:0;box-shadow:0 0 10px rgba(80,255,120,.35)}
#hans:focus{border-color:#6cff8a}#hans.bad{border-color:#ff5a4a;color:#ff8a7a;animation:sk .3s}#hans:disabled{opacity:.45}
@keyframes sk{25%{transform:translateX(-54%)}75%{transform:translateX(-46%)}}
.gov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;background:rgba(0,0,0,.62);color:#6cff8a;font:700 2.8cqw/1.4 'Courier New',monospace;text-align:center;padding:4cqw}
.gov h2{margin:0;font-size:7cqw;text-shadow:0 0 12px #2f8f4a}.gov p{margin:0;max-width:80%;white-space:pre-line}
#hw:fullscreen,#hw.fs{border-radius:0;width:100vw;height:100vh;max-width:none;background:#0b0906}
#hw.fs{position:fixed;inset:0;z-index:50}
#hw:fullscreen .tvb,#hw.fs .tvb{flex:1;display:grid;place-items:center;min-height:0}
#hw:fullscreen .gscr,#hw.fs .gscr{width:min(100%,calc((100vh - 110px)*1.3333))}
@media(max-width:560px){.dock button{font-size:10px;padding:12px 10px 10px}}
.bar .fsb{font-size:13px;line-height:1}.bar .fsb:disabled{opacity:.4;cursor:default}
.vol{position:relative}
.vp{display:none;position:absolute;right:-6px;top:calc(100% + 8px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.vp::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.vol:hover .vp,.vol:focus-within .vp{display:block}
.vp label{display:grid;gap:4px;margin:0 0 10px;font:600 11px system-ui,sans-serif;color:var(--mute);white-space:nowrap}
.vp label:last-child{margin:0}.vp input{width:130px;accent-color:var(--acc);margin:0}
.sw{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:92px;height:26px;padding:0 7px 0 25px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 11px system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;user-select:none;white-space:nowrap;transition:background .25s,border-color .25s}
.sw:hover{border-color:var(--acc)}
.sw .t{position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px;line-height:1;transition:transform .25s cubic-bezier(.5,0,.2,1)}
.sw .t::after{content:"⇄"}
.sw.on{padding:0 25px 0 7px;background:color-mix(in srgb,var(--acc) 16%,var(--bg));border-color:var(--acc)}
.sw.on .t{transform:translateX(66px)}
.dl{display:grid;gap:10px;margin-top:16px}
.dbtn{display:flex;flex-direction:column;gap:2px;padding:14px 18px;text-align:center}
.dbtn b{font-size:17px}.dbtn small{color:var(--mute);font-weight:500}
.gdb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
#hdb .dbtn::after,#hsb .dbtn::after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%) translateY(4px);padding:3px 9px;border-radius:6px;background:rgba(2,26,12,.96);border:1px solid #2f8f4a;color:#9dffb8;font:700 11px 'Courier New',monospace;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;z-index:5}
#hdb .dbtn::after{bottom:calc(100% + 6px)}#hsb .dbtn::after{top:calc(100% + 6px)}
#hdb .dbtn:hover::after,#hsb .dbtn:hover::after{opacity:1;transform:translateX(-50%)}
.gov .dbtn{position:relative}
.gov .dbtn.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 24%,var(--bg))}

#hc,#hhud{position:absolute;inset:0;z-index:1;pointer-events:none}#hc{image-rendering:auto}.dock{flex-wrap:wrap}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<button id="lang" aria-label="Language">TR</button>
<button id="theme" aria-label="Theme">☀️</button>
<div class="stage"><section class="panel" id="pv"><div class="wrap">
<main class="win">
  <div class="bar"><button class="mn" data-w="v" aria-label="Minimize"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button><button class="sw" id="dir"><span id="dl">ENG → TR</span><span class="t"></span></button><div class="st"><span class="g" id="sg"></span><span class="r" id="sw"></span><span id="sp"></span></div></div>

    <div class="msg" id="msg"></div>
    <div class="row">
      <button class="b p" id="check" data-k="check">Kontrol et</button>
      <button class="b" id="reveal" data-k="reveal">Cevabı göster</button>
    </div>
    <div class="hint" id="h1"><span class="lab" data-k="labImg">Görsel ipucu</span><div class="c emo" id="emo"></div></div>

    <div class="hint" id="h2"><span class="lab" data-k="labSen">Örnek cümle</span><div class="c sen" id="sen"></div></div>
    <div class="row"><button class="b" id="b2">İpucunu göster</button></div>
    <div class="row" style="margin-top:22px">
      <button class="b" id="prev" data-k="prev">← Önceki</button>
      <button class="b" id="next" data-k="next">Sonraki →</button>
      <button class="b" id="home" aria-label="Home" style="display:inline-flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg></button>
      <button class="b" id="shuf" data-k="shuf">🔀 Karıştır</button>
      <button class="b p" id="fin" data-k="fin">Bitir</button>

  </div>
  <div class="body" id="res" style="display:none">

    <div class="det"><table id="det"></table></div>
    <div class="row"><button class="b" id="back" data-k="back">← Sorulara dön</button><button class="b p" id="again" data-k="again">Yeniden başla</button></div>
  </div>
</main>
<div class="tools">
  <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
  <button class="b" id="imp" data-k="imp">📥 Excel içe aktar</button>
  <button class="b" id="def" style="display:none" data-k="def">Varsayılan liste</button>
  <div id="imsg" style="margin-top:8px;line-height:1.5"></div>
</div>
</div></section><section class="panel min" id="pc" style="display:none"><div class="win cw">
<div class="bar"><button class="mn" data-w="c" aria-label="Minimize"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button><span class="ttl">EXCEL IMAGE CONVERTER</span></div>
<div class="body cb">
<p class="s" data-k="cSub"></p>
<div id="cdrop" data-k="cDrop"></div>
<input type="file" id="cfile" accept="image/*" multiple hidden>
<div class="ct"><button class="b" id="cim" data-k="cImp"></button><input type="file" id="cxf" accept=".xlsx,.xls,.csv" hidden><button class="b p" id="cxl" data-k="cXl"></button><button class="b" id="ccp" data-k="cCp"></button><button class="b" id="cclr" data-k="cClr"></button><span id="cmsg"></span></div>
<div class="tw"><table><thead><tr><th data-k="thImg"></th><th data-k="thEn"></th><th data-k="thTr"></th><th data-k="thSEn"></th><th data-k="thSTr"></th><th data-k="thSz"></th><th></th></tr></thead><tbody id="ctb"></tbody></table><div class="empty" id="cem" data-k="cEmpty"></div></div>
</div></div></section><section class="panel min" id="ph" style="display:none"><div class="win gw" id="hw">
<div class="bar"><button class="mn" data-w="h" aria-label="Minimize"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
<button class="sw" id="hdir" type="button"><span id="hdl">ENG → TR</span><span class="t"></span></button>
<div class="st"><span class="g" id="hsc"></span><span id="hq"></span><span class="r" id="hlv"></span><div class="vol"><button class="fsb" id="hspk" aria-label="Volume">🔊</button><div class="vp"><label><span data-k="gSfx"></span><input type="range" id="hvs" min="0" max="100" value="50"></label><label><span data-k="gMus"></span><input type="range" id="hvm" min="0" max="100" value="50"></label></div></div><button class="fsb" id="hpz" aria-label="Pause" disabled>⏸</button><button class="fsb" id="hrs" aria-label="Restart">↻</button><button class="fsb" id="hhome" aria-label="Home"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4zM10 20v-6h4v6"/></svg></button><button class="fsb" id="hfs" aria-label="Fullscreen" style="width:26px;height:26px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;color:var(--mute);display:grid;place-items:center;padding:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div></div>
<div class="tvb" id="htv"><div class="gscr"><canvas id="hbg" width="640" height="480"></canvas><canvas id="hc"></canvas><canvas id="hhud" width="640" height="480"></canvas>

</div><div class="tools"><button class="b" id="himp" data-k="imp"></button><button class="b" id="hdef" style="display:none" data-k="def"></button><div id="himsg" style="margin-top:8px;line-height:1.5"></div></div></section></div>

<script>
const BUILTIN=[
["ubiquitous","her yerde bulunan|yaygın","🌍","Smartphones have become ubiquitous in modern life.","C1"],
["reluctant","isteksiz|gönülsüz","😒","She was reluctant to share her opinion.","B2"],
["inevitable","kaçınılmaz","🌊","Change is inevitable in any growing company.","B2"],
["meticulous","titiz|özenli","🔍","He is meticulous about keeping records.","C1"],
["ambiguous","belirsiz|muğlak|çok anlamlı","❓","The wording of the contract was ambiguous.","C1"],
["resilient","dirençli|esnek","🌱","Children are often remarkably resilient.","C1"],
["scarce","kıt|az bulunan","🏜️","Water is scarce in the region.","B2"],
["thrive","gelişmek|serpilmek|başarılı olmak","🌳","Plants thrive in rich soil.","B2"],
["acknowledge","kabul etmek|itiraf etmek|tanımak","🤝","She acknowledged her mistake.","B2"],
["contemplate","düşünmek|tasarlamak|üzerinde düşünmek","🤔","He contemplated leaving his job.","C1"],
["compelling","ikna edici|etkileyici|zorlayıcı","🧲","She made a compelling argument.","C1"],

document.querySelectorAll('#hsb .dbtn').forEach(b=>b.onclick=()=>{gs=b.dataset.s;go()});

  if(document.fullscreenElement||gw.classList.contains('fs')){if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});gw.classList.remove('fs')}
  else{try{await gw.requestFullscreen()}catch(e){gw.classList.add('fs')}}

};

  if(e.key==='Escape')gw.classList.remove('fs');
  if(e.key==='Enter'&&!e.repeat&&cur==='h'&&(kind==='over'||kind==='win')&&performance.now()-ovT>800){
    const a=document.activeElement;if(!(a&&a.tagName==='BUTTON'&&!a.disabled)){e.preventDefault();start()}}
  if(e.key==='Tab'&&cur==='h'&&(kind==='run'||kind==='pause')){e.preventDefault();if(!e.repeat)kind==='run'?pause():resume()}
},true);

city();ov('idle');requestAnimationFrame(loop);
})();
